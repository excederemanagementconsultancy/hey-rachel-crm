<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0b4a3d">

<title>Hey Rachel CRM</title>

<style>
html,
body{
 margin:0;
 min-height:100%;

 background:#061710;
 color:#f6f0e5;

 font-family:
 -apple-system,
 BlinkMacSystemFont,
 "Segoe UI",
 sans-serif;
}

#boot{
 min-height:100vh;

 display:grid;
 place-items:center;

 padding:24px;

 text-align:center;
}

#boot strong{
 display:block;

 font-family:
 Georgia,
 "Times New Roman",
 serif;

 font-style:italic;
 font-size:36px;

 color:#f3e9d6;
}

#boot span{
 display:block;

 margin-top:10px;

 color:#d8ad50;

 font-size:11px;

 letter-spacing:.18em;

 text-transform:uppercase;
}

#boot small{
 display:block;

 margin-top:18px;

}
</style>

</head>

<body>

<div id="boot">

 <div>

  <strong>
   Hey Rachel
  </strong>

  <span>
   CRM
  </span>

  <small>
   Loading workspace…
  </small>

 </div>

</div>

<script>

(async()=>{

 const sourceFile=
  "./excedere-crm-index.html";

 try{

  const response=
   await fetch(
    `${sourceFile}?v=${Date.now()}`,
    {
     cache:"no-store"
    }
   );

  if(
   !response.ok
  ){

   throw new Error(
    `Could not load CRM base (${response.status})`
   );
  }

  let html=
   await response.text();


  /* =====================================================
     KEEP HEY RACHEL COMPLETELY SEPARATE FROM EXCEDERE
  ===================================================== */

  html=
   html

   .replaceAll(
    "Excedere",
    "Hey Rachel"
   )

   .replace(
    /const SUPABASE_URL=\s*"[^"]+";/,
    `const SUPABASE_URL=
 "https://placeholder.supabase.co";`
   )

   .replace(
    /const SUPABASE_PROJECT_REF=\s*"[^"]+";/,
    `const SUPABASE_PROJECT_REF=
 "hey-rachel-pending";`
   )

   .replace(
    /const SUPABASE_PUBLISHABLE_KEY=\s*"[^"]+";/,
    `const SUPABASE_PUBLISHABLE_KEY=
 "hey-rachel-setup-placeholder";`
   )

   .replace(
    /const CALL_ASSIST_URL=\s*"[^"]+";/,
    `const CALL_ASSIST_URL=
 "https://excederemanagementconsultancy.github.io/hey-rachel-call-assist/";`
   )

   .replaceAll(
    `"excedereCallAssistLeads"`,
    `"heyRachelCallAssistLeads"`
   )

   .replaceAll(
    `"excedereCallAssistLeadsBackup"`,
    `"heyRachelCallAssistLeadsBackup"`
   )

   .replaceAll(
    `"excedereCRMCompanies"`,
    `"heyRachelCRMCompanies"`
   )

   .replaceAll(
    `"excedereCRMCompaniesBackup"`,
    `"heyRachelCRMCompaniesBackup"`
   )

   .replaceAll(
    `"excedereCRMTimeline"`,
    `"heyRachelCRMTimeline"`
   )

   .replaceAll(
    `"excedereCRMTimelineBackup"`,
    `"heyRachelCRMTimelineBackup"`
   )

   .replaceAll(
    `"excedereCRMTasks"`,
    `"heyRachelCRMTasks"`
   )

   .replaceAll(
    `"excedereCRMTasksBackup"`,
    `"heyRachelCRMTasksBackup"`
   );


  /* =====================================================
     HEY RACHEL THEME
  ===================================================== */

  const theme=`

<style id="heyRachelTheme">

:root{

 --bg:#061710 !important;
 --bg2:#0a241b !important;

 --panel:#0c271e !important;
 --panel2:#103126 !important;
 --panel3:#153b2e !important;

 --line:#2e5143 !important;
 --line2:#234337 !important;

 --text:#f6f0e5 !important;
 --muted:#a9bbb1 !important;

 --gold:#d8ad50 !important;
 --gold2:#efd38a !important;

 --silver:#e8e0d3 !important;

 --blue:#8ecdb9 !important;
 --green:#69c997 !important;

 --amber:#d8ad50 !important;
}


body{

 background:

  radial-gradient(
   circle at 78% -5%,
   rgba(21,107,83,.22),
   transparent 34%
  ),

  radial-gradient(
   circle at 6% 96%,
   rgba(216,173,80,.09),
   transparent 30%
  ),

  linear-gradient(
   145deg,
   #061710,
   #0a241b
  )

  !important;
}


.sidebar{

 background:

  linear-gradient(
   180deg,
   rgba(5,27,20,.99),
   rgba(7,36,27,.98)
  )

  !important;
}


.topbar{

 background:
 rgba(5,27,20,.94)

 !important;
}


.card,
.modal-box,
.login-card{

 background:

 linear-gradient(
  155deg,
  #0c271e,
  #071b14
 )

 !important;
}


.search,
.form-input,
.login-input{

 background:
 #081f17

 !important;

 border-color:
 #3a6252

 !important;
}


.secondary-btn,
.mini-btn{

 background:
 #103126

 !important;

 border-color:
 #3a6252

 !important;
}


.contact-row:hover,
.company-row:hover,
.linked-contact:hover{

 background:
 #0f2f24

 !important;
}


.pipeline-column{

 background:
 rgba(7,31,23,.88)

 !important;
}


.pipeline-card,
.linked-contact,
.timeline-item{

 background:
 #0c2a20

 !important;

 border-color:
 #315746

 !important;
}


/* =====================================================
   HEY RACHEL LOGO MARK
===================================================== */

.brand-mark,
.login-mark{

 background-image:

 url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 160 160'><rect width='160' height='160' rx='42' fill='%230b4a3d'/><circle cx='80' cy='80' r='63' fill='none' stroke='%23d8ad50' stroke-width='4'/><path d='M108 41c-12 0-22 7-28 18-6-11-16-18-28-18-18 0-31 14-31 31 0 31 41 54 59 64 18-10 59-33 59-64 0-17-13-31-31-31z' fill='none' stroke='%23d8ad50' stroke-width='3' opacity='.92'/><text x='80' y='92' text-anchor='middle' font-family='Georgia,serif' font-style='italic' font-size='38' fill='%23f4dfaa'>HR</text></svg>")

 !important;

 background-color:
 #0b4a3d

 !important;

 background-size:
 cover

 !important;

 background-position:
 center

 !important;

 border:
 1px solid rgba(
  216,
  173,
  80,
  .72
 )

 !important;

 box-shadow:
 0 0 28px rgba(
  216,
  173,
  80,
  .16
 )

 !important;
}


.brand-mark::before,
.brand-mark::after,
.login-mark::before,
.login-mark::after{

 content:none

 !important;

 display:none

 !important;
}


/* =====================================================
   WORDMARK
===================================================== */

.brand-word,
.login-name{

 background:none

 !important;

 -webkit-background-clip:
 initial

 !important;

 background-clip:
 initial

 !important;

 color:
 #f3e9d6

 !important;

 font-family:
 Georgia,
 "Times New Roman",
 serif

 !important;

 font-style:
 italic

 !important;

 letter-spacing:
 .02em

 !important;

 text-transform:
 none

 !important;
}


.brand-word{

 font-size:
 24px

 !important;
}


.login-name{

 font-size:
 34px

 !important;
}


.brand-sub,
.login-sub{

 color:
 #d8ad50

 !important;

 font-weight:
 800

 !important;

 letter-spacing:
 .22em

 !important;
}


/* =====================================================
   POWERED BY EXCEDERE
===================================================== */

.brand-powered,
.login-powered{

 margin-top:
 7px;

 color:
 #9fb4a8;

 font-size:
 7px;

 line-height:
 1.55;

 letter-spacing:
 .09em;

 text-transform:
 uppercase;
}


.login-powered{

 margin-top:
 10px;

 font-size:
 8px;
}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar-tagline{

 color:
 #9fb4a8

 !important;

 font-family:
 -apple-system,
 BlinkMacSystemFont,
 "Segoe UI",
 sans-serif

 !important;

 font-size:
 7px

 !important;

 line-height:
 1.75

 !important;

 letter-spacing:
 .12em

 !important;
}


.nav-btn:hover{

 background:
 #0d2b21

 !important;
}


.stat-card{

 background:

 linear-gradient(
  145deg,
  #0c2a20,
  #103126
 )

 !important;
}


.activity-icon{

 background:
 #183d30

 !important;

 border-color:
 #355f4f

 !important;
}


.status-new,
.company-status-inactive{

 background:
 #1b3d31

 !important;

 border-color:
 #6c8379

 !important;
}

</style>

`;


  /* =====================================================
     HEY RACHEL SETUP MODE
  ===================================================== */

  const setup=`

<script id="heyRachelSetup">

(function(){

 const poweredText=
  "Powered by Excedere Management Consultancy";


 function addPowered(
  parent,
  className
 ){

  if(
   !parent ||
   parent.querySelector(
    "."+className
   )
  ){

   return;
  }

  const element=
   document.createElement(
    "div"
   );

  element.className=
   className;

  element.textContent=
   poweredText;

  parent.appendChild(
   element
  );
 }


 function applyHeyRachelBrand(){

  document.title=
   "Hey Rachel CRM";


  /* -----------------------------------------------
     SIDEBAR BRAND
  ----------------------------------------------- */

  const brandWord=
   document.querySelector(
    ".brand-word"
   );

  if(
   brandWord
  ){

   brandWord.textContent=
    "Hey Rachel";
  }


  const brandSub=
   document.querySelector(
    ".brand-sub"
   );

  if(
   brandSub
  ){

   brandSub.textContent=
    "CRM";
  }


  const brandMark=
   document.querySelector(
    ".brand-mark"
   );

  if(
   brandMark
  ){

   brandMark.setAttribute(
    "aria-label",
    "Hey Rachel CRM"
   );
  }


  const brandText=
   document.querySelector(
    ".brand-top > div:last-child"
   );

  addPowered(
   brandText,
   "brand-powered"
  );


  /* -----------------------------------------------
     LOGIN BRAND
  ----------------------------------------------- */

  const loginName=
   document.querySelector(
    ".login-name"
   );

  if(
   loginName
  ){

   loginName.textContent=
    "Hey Rachel";
  }


  const loginSub=
   document.querySelector(
    ".login-sub"
   );

  if(
   loginSub
  ){

   loginSub.textContent=
    "CRM";
  }


  addPowered(
   document.querySelector(
    ".login-brand"
   ),
   "login-powered"
  );


  const loginCopy=
   document.querySelector(
    ".login-copy"
   );

  if(
   loginCopy
  ){

   loginCopy.textContent=
    "Sign in to Hey Rachel CRM to load your workspace.";
  }


  /* -----------------------------------------------
     SIDEBAR MESSAGE
  ----------------------------------------------- */

  const sidebarTagline=
   document.querySelector(
    ".sidebar-tagline"
   );

  if(
   sidebarTagline
  ){

   sidebarTagline.innerHTML=
    "VA.<br>CONTENT.<br>SYSTEMS.<br>DISTRIBUTION.";
  }


  /* -----------------------------------------------
     DASHBOARD COPY
  ----------------------------------------------- */

  const subtitle=
   document.getElementById(
    "pageSubtitle"
   );

  if(
   subtitle &&
   subtitle.textContent.includes(
    "Hey Rachel"
   )
  ){

   subtitle.textContent=
    "Your Hey Rachel sales activity at a glance.";
  }


  /* -----------------------------------------------
     FAVICON
  ----------------------------------------------- */

  let icon=
   document.querySelector(
    'link[rel="icon"]'
   );

  if(
   !icon
  ){

   icon=
    document.createElement(
     "link"
    );

   icon.rel=
    "icon";

   document.head.appendChild(
    icon
   );
  }


  icon.type=
   "image/svg+xml";


  icon.href=
   "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='18' fill='%230b4a3d'/><circle cx='32' cy='32' r='25' fill='none' stroke='%23d8ad50' stroke-width='2'/><text x='32' y='39' text-anchor='middle' font-family='Georgia,serif' font-style='italic' font-size='22' fill='%23f1d487'>HR</text></svg>";


  let appleIcon=
   document.querySelector(
    'link[rel="apple-touch-icon"]'
   );

  if(
   appleIcon
  ){

   appleIcon.href=
    icon.href;
  }
 }


 /* =====================================================
    DATABASE NOT CONNECTED YET
 ===================================================== */

 window.signInCRM=
  function(){

   const error=
    document.getElementById(
     "loginError"
    );

   if(
    error
   ){

    error.textContent=
     "Hey Rachel CRM branding is ready. The separate Hey Rachel database is the next step, so sign-in is temporarily disabled.";

    error.classList.add(
     "show"
    );
   }
  };


 /* =====================================================
    CALL ASSIST PLACEHOLDER
 ===================================================== */

 window.openCallAssist=
  function(){

   alert(
    "Hey Rachel Call Assist will be connected after the separate Hey Rachel database is created."
   );
  };


 window.openLeadInCallAssist=
  function(){

   alert(
    "Hey Rachel Call Assist will be connected after the separate Hey Rachel database is created."
   );
  };


 window.emailLead=
  function(){

   alert(
    "Hey Rachel email tools will be connected after the separate Hey Rachel database is created."
   );
  };


 /* =====================================================
    INITIAL DISPLAY
 ===================================================== */

 window.addEventListener(
  "load",
  ()=>{

   applyHeyRachelBrand();


   const status=
    document.getElementById(
     "syncStatusText"
    );

   if(
    status
   ){

    status.textContent=
     "Setup mode";
   }


   const sync=
    document.getElementById(
     "syncStatus"
    );

   if(
    sync
   ){

    sync.classList.remove(
     "synced",
     "error"
    );

    sync.classList.add(
     "syncing"
    );
   }
  }
 );


 applyHeyRachelBrand();

})();

<\/script>

`;


  /* =====================================================
     ADD HEY RACHEL LAYER TO THE EXISTING CRM
  ===================================================== */

  html=
   html.replace(
    "</head>",
    `${theme}
</head>`
   );


  html=
   html.replace(
    "</body>",
    `${setup}
</body>`
   );


  document.open();

  document.write(
   html
  );

  document.close();


 }catch(error){

  console.error(
   error
  );


  document
   .getElementById(
    "boot"
   )
   .innerHTML=
   `

<div>

 <strong>
  Hey Rachel
 </strong>

 <span>
  CRM
 </span>

 <small>
  Could not load the CRM base.
  Make sure <b>excedere-crm-index.html</b>
  is still in this repository.
 </small>

</div>

`;

 }

})();

</script>

</body>
</html>
